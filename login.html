
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jelajah Sulbar | Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">Jelajah Sulbar</a>
      <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu" aria-label="Buka menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Beranda</a></li>
          <li class="nav-item"><a class="nav-link" href="wisata.html">Wisata</a></li>
          <li class="nav-item"><a class="nav-link" href="detail.html">Detail</a></li>
          <li class="nav-item"><a class="nav-link" href="tentang.html">Tentang</a></li>
          <li class="nav-item"><a class="nav-link active" href="login.html">Login</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <div class="login-box mx-auto shadow">
      <h1 class="text-center fw-bold">Login</h1>
      <p class="text-center text-secondary">Masuk ke halaman demo Jelajah Sulbar.</p>

      <form id="loginForm" novalidate>
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input type="email" class="form-control" id="email" placeholder="nama@email.com" required>
          <div class="invalid-feedback">Masukkan alamat email yang valid.</div>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input type="password" class="form-control" id="password" placeholder="Minimal 8 karakter" minlength="8" required>
          <div class="invalid-feedback">Password wajib diisi minimal 8 karakter.</div>
        </div>

        <button type="submit" class="btn btn-primary w-100">Masuk</button>
        <div id="loginMessage" class="mt-3" role="status" aria-live="polite"></div>
      </form>

      <p class="small text-secondary mt-3 mb-0">
        Catatan: form ini hanya demonstrasi validasi, bukan autentikasi sungguhan.
      </p>
    </div>
  </main>

  <footer class="footer text-center py-4">
    <p class="mb-0">&copy; 2026 Jelajah Sulbar</p>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
